@if (rows().length) {
  <ul class="m-0 flex list-none flex-col gap-2.5 p-0">
    @for (row of rows(); track row.id) {
      <li [class]="row.rowClass + ' rounded-[10px] px-3 py-2.5'">
        <p class="m-0 flex items-baseline gap-2">
          <span class="text-[13px] font-semibold text-muted">{{ row.time }}</span>
          <span class="truncate text-[15px] font-bold text-ink-strong">{{ row.name }}</span>
        </p>

        <p class="mt-0.5 mb-0 text-[11px] text-muted">
          DNI: {{ row.dni }}
          @if (!row.success) {
            <span class="font-semibold text-danger-strong"> · {{ row.reason }}</span>
          }
        </p>
      </li>
    }
  </ul>
} @else {
  <p class="my-6 text-center text-sm text-muted">{{ emptyMessage() }}</p>
}
